<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Spot the Car — Devine le phare</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap');

:root{
  --bg: #14141a;
  --surface: #1f2027;
  --surface-2: #2a2b34;
  --line: #38393f;
  --amber: #ffb020;
  --amber-dim: #7a5a1a;
  --red: #e8433f;
  --green: #3fae6a;
  --text: #f2f0ea;
  --muted: #9a9aa4;
  --radius: 12px;
}

*{ box-sizing: border-box; }

html,body{
  margin:0; padding:0;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at 50% -10%, #23242c 0%, #14141a 55%);
  color: var(--text);
  font-family: 'Work Sans', sans-serif;
}

.app{
  max-width: 480px;
  margin: 0 auto;
  height: 100dvh;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 1.4vh 3vw 1vh;
  gap: 0.6vh;
}

.eyebrow{
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(8px, 2vh, 10px);
  letter-spacing: 0.16em;
  color: var(--amber);
  text-transform: uppercase;
  text-align:center;
  flex-shrink: 0;
}

h1{
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: clamp(18px, 4vh, 26px);
  letter-spacing: 0.01em;
  text-align: center;
  margin: 0;
  flex-shrink: 0;
}

.logo-title{
  display: block;
  height: clamp(64px, 13vh, 150px);
  width: auto;
  max-width: 92%;
  margin: 0 auto;
  flex-shrink: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: rgba(255,178,32,0.25);
}
.logo-title:active{ opacity: 0.85; }

.subtitle{
  text-align:center;
  color: var(--muted);
  font-size: clamp(9px, 2.1vh, 12px);
  flex-shrink: 0;
  line-height: 1.25;
}

.dash{
  display:flex;
  justify-content: space-between;
  align-items:center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.7vh 10px;
  flex-shrink: 0;
}

.dash-item{ text-align:center; flex:1; }
.dash-label{
  font-size: clamp(7px, 1.6vh, 9px);
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
  line-height: 1.4;
}
.dash-value{
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: clamp(13px, 2.6vh, 17px);
  color: var(--amber);
  line-height: 1.2;
}
.dash-div{ width:1px; align-self: stretch; background: var(--line); }

.viewport-frame{
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  padding: 5px;
  background: linear-gradient(145deg, #35363f, #1c1d23);
  border: 1px solid var(--line);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 8px 20px -12px rgba(0,0,0,0.8);
  overflow: hidden;
}

.viewport{
  position: relative;
  height: 100%;
  width: auto;
  max-width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 8px;
  overflow: hidden;
  background: #0c0c0f;
}

.viewport img{
  position:absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform-origin: 50% 50%;
  transform: scale(2.6);
  transition: transform 0.6s cubic-bezier(.2,.7,.2,1), transform-origin 0.4s ease, filter 0.5s ease;
  filter: blur(6px) saturate(0.9);
}
.viewport img.focused{ filter: blur(0px) saturate(1.05); }

.img-broken{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  text-align:center; padding: 20px;
  font-family:'Work Sans', sans-serif;
  font-size: 13px;
  color: var(--muted);
  background: #0c0c0f;
}

.scanline{
  position:absolute; inset:0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.035) 0px,
    rgba(255,255,255,0.035) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events:none;
  mix-blend-mode: overlay;
}

.corner-tag{
  position:absolute;
  top:6px; left:6px;
  font-family:'JetBrains Mono', monospace;
  font-size: 9px;
  background: rgba(0,0,0,0.55);
  color: var(--amber);
  padding: 2px 6px;
  border-radius: 5px;
  letter-spacing: 0.05em;
  border: 1px solid rgba(255,176,32,0.35);
}

.zoom-dots{
  display:flex;
  justify-content: center;
  gap: 5px;
  flex-shrink: 0;
}
.zoom-dots span{
  width: 18px; height: 3px;
  border-radius: 2px;
  background: var(--line);
  transition: background 0.3s;
}
.zoom-dots span.used{ background: var(--amber-dim); }
.zoom-dots span.current{ background: var(--amber); }

.feedback{
  text-align:center;
  font-family:'Rajdhani', sans-serif;
  font-weight:700;
  font-size: clamp(11px, 2.3vh, 14px);
  min-height: 2.4vh;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}
.feedback.correct{ color: var(--green); }
.feedback.wrong{ color: var(--red); }
.feedback.reveal{ color: var(--muted); font-weight: 500; font-size: clamp(10px, 2vh, 12px); }

.options{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  flex-shrink: 0;
}

.opt{
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: clamp(10px, 2vh, 12.5px);
  padding: 1.1vh 6px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  text-align:center;
  line-height: 1.2;
  transition: transform 0.12s ease, border-color 0.2s, background 0.2s;
}
.opt:hover:not(:disabled){ border-color: var(--amber); transform: translateY(-1px); }
.opt:active:not(:disabled){ transform: translateY(0); }
.opt:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }

.opt.correct{ background: rgba(63,174,106,0.18); border-color: var(--green); color: #d9f5e4; }
.opt.wrong{ background: rgba(232,67,63,0.16); border-color: var(--red); color: #ffd9d7; }
.opt.dim{ opacity: 0.45; }
.opt:disabled{ cursor: default; }

.controls{
  display:flex;
  gap: 8px;
  flex-shrink: 0;
}

.btn{
  flex:1;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: clamp(11px, 2.2vh, 13px);
  letter-spacing: 0.03em;
  padding: 1.1vh 8px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  text-transform: uppercase;
  transition: filter 0.15s, transform 0.1s;
}
.btn:active{ transform: translateY(1px); }
.btn-primary{ background: var(--amber); color: #1a1305; }
.btn-primary:hover{ filter: brightness(1.08); }
.btn-ghost{ background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn-ghost:hover{ filter: brightness(1.15); }
.btn:disabled{ opacity: 0.4; cursor: default; }

.credit{
  text-align:center;
  font-size: clamp(7px, 1.5vh, 9px);
  color: var(--muted);
  line-height: 1.3;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.credit a{ color: var(--muted); text-decoration: underline; }

.end-card{
  text-align:center;
  padding: 3vh 14px;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.end-card .big{
  font-family:'JetBrains Mono', monospace;
  font-size: clamp(30px, 8vh, 44px);
  font-weight: 700;
  color: var(--amber);
  margin: 8px 0 2px;
}

@media (prefers-reduced-motion: reduce){
  .viewport img{ transition: none; }
  .opt{ transition: none; }
}

/* ---- Home / start screen ---- */
.app:has(.home-screen){ padding: 0; gap: 0; }
.home-screen{
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 100%;
  overflow: hidden;
}
.home-photo{
  position: relative;
  height: 100%;
  width: auto;
  max-width: 100%;
  aspect-ratio: 853 / 1844;
  background-size: cover;
  background-position: center;
}
.home-hit{
  position: absolute;
  cursor: pointer;
  -webkit-tap-highlight-color: rgba(255,178,32,0.25);
}
.home-toast{
  position: absolute;
  left: 50%;
  bottom: 4%;
  transform: translateX(-50%);
  background: rgba(20,14,34,0.95);
  border: 1px solid rgba(255,178,32,0.4);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  white-space: nowrap;
  z-index: 5;
  opacity: 0;
  animation: home-toast-fade 1.6s ease forwards;
}
@keyframes home-toast-fade{
  0%{ opacity: 0; transform: translateX(-50%) translateY(6px); }
  15%{ opacity: 1; transform: translateX(-50%) translateY(0); }
  80%{ opacity: 1; }
  100%{ opacity: 0; }
}

.turn-banner{
  text-align:center;
  font-family:'JetBrains Mono', monospace;
  font-size: clamp(10px, 2.4vh, 12px);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #1a1206;
  background: linear-gradient(180deg, #ffd25c, #ffb020);
  border-radius: 20px;
  padding: 4px 12px;
  margin: 2px auto 0;
  width: fit-content;
  flex-shrink: 0;
}

.settings-badge{
  position: absolute;
  background: rgba(63,174,106,0.92);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
  z-index: 4;
  pointer-events: none;
}

.end-2p{
  display: flex;
  gap: 12px;
  width: 100%;
  justify-content: center;
}
.end-2p-col{
  flex: 1 1 0;
  max-width: 180px;
  text-align: center;
  padding: 10px 6px;
  border-radius: 12px;
  border: 1px solid var(--line);
}
.end-2p-col.winner{
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber), 0 0 16px rgba(255,178,32,0.35);
}
.end-2p-metric{
  font-family:'JetBrains Mono', monospace;
  font-size: 16px;
  color: var(--text);
  margin-top: 4px;
}

/* ---- Desktop: keep the exact same portrait/mobile layout, just presented as a centered card ---- */
@media (min-width: 860px) and (min-height: 560px){
  .app{
    max-width: 480px;
    height: 100vh;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
}

const COMMONS_FILE_PAGE = "https://commons.wikimedia.org/wiki/File:";

const POINTS_BY_LEVEL = [100, 60, 30, 10];
const N_LEVELS = POINTS_BY_LEVEL.length;

// Builds this car's own zoom steps from its maxScale, going down to 1.0 (full reveal)
function zoomLevelsFor(car){
  const maxS = car.maxScale !== undefined ? car.maxScale : 2.6;
  const steps = [];
  for(let i = 0; i < N_LEVELS; i++){
    const t = i / (N_LEVELS - 1);
    steps.push(maxS + (1 - maxS) * t); // linear from maxS down to 1.0
  }
  return steps;
}

function anchorFor(car){
  return {
    x: car.anchorX !== undefined ? car.anchorX : 50,
    y: car.anchorY !== undefined ? car.anchorY : 50
  };
}

let order = [];
let qIndex = 0;
let level = 0;
let currentOptions = [];
let eliminated = [];   // wrong picks for the current question (stay disabled)
let resolved = false;  // question fully resolved (correct found, or forced reveal after a mistake)

let mode = 'classique';   // 'classique' (Jouer, 20) | 'facile' (pas de zoom) | 'rapide' (10) | 'illimitee' (mort subite)
let twoPlayer = false;  // mode 2 joueurs en alternance
let players = [{ score: 0, streak: 0, bestStreak: 0, correct: 0, active: true }];
let currentPlayer = 0;
let turnPointer = 0;

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame(selectedMode){
  if(selectedMode) mode = selectedMode;
  const totals = { classique: 20, facile: CARS.length, rapide: 10, illimitee: CARS.length };
  const total = totals[mode] || 20;
  order = shuffle(CARS.map((_, i) => i)).slice(0, total);
  qIndex = 0;
  players = twoPlayer
    ? [{ score: 0, streak: 0, bestStreak: 0, correct: 0, active: true },
       { score: 0, streak: 0, bestStreak: 0, correct: 0, active: true }]
    : [{ score: 0, streak: 0, bestStreak: 0, correct: 0, active: true }];
  turnPointer = 0;
  currentPlayer = 0;
  loadQuestion();
}

function playClassic(){
  twoPlayer = false;
  startGame('classique');

}

function chooseMode(m){
  twoPlayer = false;
  startGame(m);
}

function loadQuestion(){
  level = (mode === 'facile') ? N_LEVELS - 1 : 0;
  eliminated = [];
  resolved = false;
  const car = CARS[order[qIndex]];
  currentOptions = shuffle([car.name, ...car.distractors]);
  render();
}

function imgUrl(car){
  return car.url;
}

function handleAnswer(picked){
  if(resolved) return;
  const car = CARS[order[qIndex]];
  const correct = picked === car.name;
  const p = players[currentPlayer];

  if(correct){
    const pts = POINTS_BY_LEVEL[level];
    p.score += pts;
    p.streak += 1;
    p.bestStreak = Math.max(p.bestStreak, p.streak);
    p.correct += 1;
    resolved = true;
    level = N_LEVELS - 1; // reveal the whole car
    render(picked, true);
    return;
  }

  p.streak = 0;
  if(!eliminated.includes(picked)) eliminated.push(picked);

  const suddenDeath = mode === 'illimitee';
  const shouldReveal = suddenDeath || eliminated.length >= 2;

  if(shouldReveal){
    // mort subite (illimité) ou 2e erreur sur cette voiture : on révèle la réponse
    resolved = true;
    if(suddenDeath) p.active = false; // pas de seconde chance en mode illimité
    render(picked, false);
  } else {
    // 1re erreur (modes rapide/moyenne) : on dézoome automatiquement et on peut retenter direct
    if(level < N_LEVELS - 1) level += 1;
    render();
  }
}

function nextHint(){
  if(level < N_LEVELS - 1){
    level += 1;
  }
  render();
}

function pickNextPlayer(){
  if(!twoPlayer) return 0;
  for(let i = 1; i <= players.length; i++){
    const idx = (currentPlayer + i) % players.length;
    if(players[idx].active) return idx;
  }
  return currentPlayer;
}

function nextQuestion(){
  if(mode === 'illimitee'){
    const anyActive = players.some(p => p.active);
    if(!anyActive || qIndex >= order.length - 1){ renderEnd(); return; }
    qIndex += 1;
    currentPlayer = pickNextPlayer();
    loadQuestion();
    return;
  }
  if(qIndex < order.length - 1){
    qIndex += 1;
    if(twoPlayer) currentPlayer = qIndex % players.length;
    loadQuestion();
  } else {
    renderEnd();
  }
}

function render(picked, correct){
  const car = CARS[order[qIndex]];
  const isFull = level === N_LEVELS - 1;

  const optionsHtml = currentOptions.map(opt => {
    let cls = "opt";
    let dis = "";
    const isElim = eliminated.includes(opt);
    if(resolved){
      dis = "disabled";
      if(opt === car.name) cls += " correct";
      else if(isElim) cls += " wrong";
      else cls += " dim";
    } else if(isElim){
      dis = "disabled";
      cls += " wrong";
    }
    return `<button class="${cls}" ${dis} onclick="handleAnswer('${opt.replace(/'/g,"\\'")}')">${opt}</button>`;
  }).join("");

  let feedbackHtml = "";
  if(resolved){
    if(correct){
      feedbackHtml = `<div class="feedback correct">✓ Bonne réponse — c'est bien la ${car.name} !</div>`;
    } else {
      feedbackHtml = `<div class="feedback wrong">✗ C'était la ${car.name}</div>`;
    }
  } else {
    feedbackHtml = mode === 'facile'
      ? `<div class="feedback reveal">Regarde bien et devine le modèle</div>`
      : `<div class="feedback reveal">Niveau ${level+1}/${N_LEVELS} — repère le détail et devine le modèle</div>`;
  }

  let controlsHtml = "";
  if(resolved){
    const isLastCar = qIndex === order.length - 1;
    const isGameOver = mode === 'illimitee'
      ? (players.every(p => !p.active) || isLastCar)
      : isLastCar;
    controlsHtml = `<div class="controls">
      <button class="btn btn-primary" onclick="nextQuestion()">${isGameOver ? "Voir mon score" : "Voiture suivante →"}</button>
    </div>`;
  } else if(mode !== 'facile'){
    controlsHtml = `<div class="controls">
      <button class="btn btn-ghost" onclick="nextHint()" ${isFull ? "disabled" : ""}>👁 Dézoomer</button>
    </div>`;
  }

  const dots = Array.from({length: N_LEVELS}).map((_, i) => {
    let c = "";
    if(i < level) c = "used";
    if(i === level) c = "current";
    return `<span class="${c}"></span>`;
  }).join("");

  const p = players[currentPlayer];

  document.getElementById("app").innerHTML = `
    <img src="data:image/png;base64,${LOGO_B64}" alt="Spot the Car" class="logo-title" onclick="renderHome()" role="button" aria-label="Retour a l accueil">
    <div class="subtitle">Un détail zoomé. Quatre choix. À toi de reconnaître le modèle.</div>
    ${twoPlayer ? `<div class="turn-banner">Au tour du Joueur ${currentPlayer+1}</div>` : ``}

    <div class="dash">
      <div class="dash-item">
        <div class="dash-label">Score</div>
        <div class="dash-value">${p.score}</div>
      </div>
      <div class="dash-div"></div>
      <div class="dash-item">
        <div class="dash-label">Série</div>
        <div class="dash-value">${p.streak}</div>
      </div>
      <div class="dash-div"></div>
      <div class="dash-item">
        <div class="dash-label">Voiture</div>
        <div class="dash-value">${mode === 'illimitee' ? (qIndex+1) : (qIndex+1)+'/'+order.length}</div>
      </div>
    </div>

    <div class="viewport-frame">
      <div class="viewport">
        <img id="carimg" src="${imgUrl(car)}" alt="Détail zoomé d'une voiture à deviner" style="transform-origin: ${anchorFor(car).x}% ${anchorFor(car).y}%; transform: scale(${zoomLevelsFor(car)[level]})" onerror="handleImgError()">
        <div class="scanline"></div>
        ${mode === 'facile' ? `` : `<div class="corner-tag">ZOOM ×${zoomLevelsFor(car)[level].toFixed(1)}</div>`}
      </div>
    </div>

    ${mode === 'facile' ? `` : `<div class="zoom-dots">${dots}</div>`}
    ${feedbackHtml}
    <div class="options">${optionsHtml}</div>
    ${controlsHtml}

    <div class="credit">
      Photo : <a href="${COMMONS_FILE_PAGE + car.wikiFile}" target="_blank" rel="noopener">Wikimedia Commons</a> — sous licence libre (CC BY-SA / domaine public selon le fichier).
    </div>
  `;

  requestAnimationFrame(() => {
    const im = document.getElementById("carimg");
    if(im) setTimeout(() => im.classList.add("focused"), 60);
  });
}

function renderEnd(){
  let bodyHtml;

  if(twoPlayer){
    const p1 = players[0], p2 = players[1];
    const winner = p1.score === p2.score ? 0 : (p1.score > p2.score ? 1 : 2);
    const metricLabel = mode === 'illimitee' ? 'Voitures trouv\u00e9es' : 'Meilleure s\u00e9rie';
    const metric = p => mode === 'illimitee' ? p.correct : (p.bestStreak + ' \ud83d\udd25');
    bodyHtml = `
      <div class="end-2p">
        <div class="end-2p-col ${winner===1 ? 'winner' : ''}">
          <div class="dash-label">Joueur 1</div>
          <div class="big">${p1.score}</div>
          <div class="dash-label" style="margin-top:8px;">${metricLabel}</div>
          <div class="end-2p-metric">${metric(p1)}</div>
        </div>
        <div class="end-2p-col ${winner===2 ? 'winner' : ''}">
          <div class="dash-label">Joueur 2</div>
          <div class="big">${p2.score}</div>
          <div class="dash-label" style="margin-top:8px;">${metricLabel}</div>
          <div class="end-2p-metric">${metric(p2)}</div>
        </div>
      </div>
      <div class="feedback ${winner ? 'correct' : 'reveal'}" style="margin-top:10px;">${winner ? ('\ud83c\udfc6 Joueur ' + winner + ' gagne !') : '\u00c9galit\u00e9 parfaite !'}</div>
    `;
  } else {
    const p1 = players[0];
    const metricLabel = mode === 'illimitee' ? 'Voitures trouv\u00e9es' : 'Meilleure s\u00e9rie';
    const metric = mode === 'illimitee' ? p1.correct : (p1.bestStreak + ' \ud83d\udd25');
    bodyHtml = `
      <div class="dash-label">Score final</div>
      <div class="big">${p1.score}</div>
      <div class="dash-label" style="margin-top:14px;">${metricLabel}</div>
      <div style="font-family:'JetBrains Mono',monospace; font-size:20px; color:var(--text); margin-top:4px;">${metric}</div>
    `;
  }

  document.getElementById("app").innerHTML = `
    <div class="eyebrow">Spot the Car \u00b7 Cat\u00e9gorie Auto</div>
    <h1>Manche termin\u00e9e</h1>
    <div class="viewport-frame end-card">
      ${bodyHtml}
    </div>
    <div class="controls" style="margin-top:18px;">
      <button class="btn btn-primary" onclick="startGame()">\ud83d\udd01 Rejouer</button>
      <button class="btn btn-ghost" onclick="renderHome()" style="margin-top:8px;">Menu principal</button>
    </div>
    <div class="credit">
      Toutes les photos proviennent de Wikimedia Commons, sous licences libres. Cliquez sur chaque cr\u00e9dit pendant la partie pour voir la source et l'auteur exact.
    </div>
  `;
}

function handleImgError(){
  const el = document.getElementById("app");
  if(!el) return;
  const vp = el.querySelector(".viewport");
  if(vp && !vp.querySelector(".img-broken")){
    const msg = document.createElement("div");
    msg.className = "img-broken";
    msg.innerHTML = "⚠️ Photo indisponible pour cette voiture";
    vp.appendChild(msg);
  }
}

renderHome();
</script>
</body>
</html>
