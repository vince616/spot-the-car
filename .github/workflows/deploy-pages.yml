name: Deploy web version (GitHub Pages)

# Publie la version web du jeu a la racine du site (https://spot-the-car.com/),
# la politique de confidentialite (docs/) sur /privacy/, et une redirection
# /play/ -> / pour les liens deja partages.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/privacy _site/play
          cp -r www/. _site/
          cp -r docs/. _site/privacy/
          mv _site/privacy/ads.txt _site/ads.txt
          mkdir -p _site/mentions-legales
          mv _site/privacy/mentions-legales.html _site/mentions-legales/index.html
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/sw.js
          cat > _site/play/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="UTF-8">
          <title>Spot the Car</title>
          <link rel="canonical" href="/">
          <meta http-equiv="refresh" content="0; url=/">
          </head><body><a href="/">Spot the Car</a></body></html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
