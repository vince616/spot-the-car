name: Generate release keystore (one-off)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore and passwords
        run: |
          STORE_PASSWORD=$(openssl rand -base64 24)
          KEY_PASSWORD=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias spotthecar \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Yuna Studios, OU=Yuna Studios, O=Yuna Studios, L=NA, S=NA, C=FR"
          {
            echo "Garde ce fichier en lieu sur (gestionnaire de mots de passe, etc). Il ne sera plus jamais regenerable a l'identique."
            echo ""
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=spotthecar"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } > keystore-passwords.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
          retention-days: 3

      - name: Upload passwords artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-passwords
          path: keystore-passwords.txt
          retention-days: 3
